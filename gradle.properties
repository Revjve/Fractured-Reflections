org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Fabric / Minecraft — https://fabricmc.net/develop
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.15.11
fabric_version=0.92.2+1.20.1

# Mod
mod_version=0.1.0
maven_group=com.revjve.fractured
archives_base_name=fractured-reflections

# Integrations (bump these to the newest 1.20.1 builds if a version has been pulled)
# Simple Voice Chat: API is compile-only; the full mod is only used for the dev client.
voicechat_api_version=2.5.0
voicechat_version=fabric-1.20.1-2.5.26
# LambDynamicLights (Modrinth Maven version string)
lambdynamiclights_version=2.3.2+1.20.1
# Immersive Portals is integrated reflectively, so it is only needed at runtime.
immersive_portals_version=v3.3.9-mc1.20.1
use_immersive_portals=true
