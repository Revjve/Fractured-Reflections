plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // LambDynamicLights, Simple Voice Chat, Immersive Portals, Mod Menu, Cloth Config
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    // Simple Voice Chat API
    maven {
        name = 'Henkelmax'
        url = 'https://maven.maxhenkel.de/repository/public'
        content {
            includeGroup 'de.maxhenkel.voicechat'
        }
    }
}

// ---------------------------------------------------------------------------------------------
// Run configurations. `ideConfigGenerated true` makes IntelliJ IDEA pick them up automatically
// when the Gradle project is imported (Run ▸ "Fractured Reflections - ..."), and they work from
// the command line too: ./gradlew runClient | runClient2 | runServer
// Every run includes Immersive Portals, LambDynamicLights and Simple Voice Chat (modLocalRuntime).
// ---------------------------------------------------------------------------------------------
loom {
    runs {
        client {
            client()
            configName = 'Fractured Reflections - Client 1 (Survivor)'
            ideConfigGenerated true
            programArgs '--username', 'Survivor'
            vmArgs '-Xmx3G'
            runDir 'run'
        }
        client2 {
            client()
            configName = 'Fractured Reflections - Client 2 (Fractured)'
            ideConfigGenerated true
            programArgs '--username', 'Fractured'
            vmArgs '-Xmx3G'
            runDir 'run2'
        }
        server {
            server()
            configName = 'Fractured Reflections - Dev Server'
            ideConfigGenerated true
            vmArgs '-Xmx3G'
            runDir 'run-server'
        }
    }
}

// Dev-server conveniences, written once (never overwritten): offline mode so the dev clients can
// join, flight allowed for The Fractured, and both dev usernames as operators so /fr works.
// The EULA is only accepted if YOU set accept_minecraft_eula=true in gradle.properties.
def serverRunDir = file('run-server')
serverRunDir.mkdirs()
def serverProps = file('run-server/server.properties')
if (!serverProps.exists()) {
    serverProps.text = 'online-mode=false\nallow-flight=true\nspawn-protection=0\nmotd=Fractured Reflections dev server\n'
}
def opsFile = file('run-server/ops.json')
if (!opsFile.exists()) {
    def ops = ['Survivor', 'Fractured'].collect { name ->
        def uuid = UUID.nameUUIDFromBytes(("OfflinePlayer:" + name).getBytes('UTF-8'))
        """  {"uuid": "${uuid}", "name": "${name}", "level": 4, "bypassesPlayerLimit": false}"""
    }
    opsFile.text = "[\n" + ops.join(',\n') + "\n]\n"
}
if (project.findProperty('accept_minecraft_eula')?.toString()?.toBoolean()) {
    file('run-server/eula.txt').text = '# Accepted via accept_minecraft_eula=true in gradle.properties (https://aka.ms/MinecraftEULA)\neula=true\n'
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Simple Voice Chat — plugin API (provided at runtime by the voicechat mod)
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
    modLocalRuntime "maven.modrinth:simple-voice-chat:${project.voicechat_version}"

    // LambDynamicLights — dynamic light handler API for the flashlight and the Fractured's core
    modCompileOnly "maven.modrinth:lambdynamiclights:${project.lambdynamiclights_version}"
    modLocalRuntime "maven.modrinth:lambdynamiclights:${project.lambdynamiclights_version}"

    // Immersive Portals — bound through reflection (see ImmersivePortalsCompat) so the mod
    // compiles and runs with or without it, across IP API revisions. Present in every dev run.
    if (project.use_immersive_portals.toBoolean()) {
        modLocalRuntime "maven.modrinth:immersiveportals:${project.immersive_portals_version}"
        modLocalRuntime "maven.modrinth:cloth-config:${project.cloth_config_version}"
    }

    // Mod Menu in the dev client, to reach Immersive Portals / LambDynamicLights settings
    if (project.use_modmenu.toBoolean()) {
        modLocalRuntime "maven.modrinth:modmenu:${project.modmenu_version}"
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// ./gradlew dist  ->  dist/fractured-reflections-<version>.jar (the file to drop into mods/)
tasks.register('dist', Copy) {
    group = 'build'
    description = 'Builds the release jar and copies it to dist/.'
    dependsOn tasks.named('remapJar')
    from tasks.named('remapJar').flatMap { it.archiveFile }
    into layout.projectDirectory.dir('dist')
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
